type: object
required:
  - _id
  - userId
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  userId:
    description: "This field stores the contact's unique ID, linking it to the respective user in the contact book"
    type: string
    example: '65e4decdd286b30065d54af9'
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: 'Contact`s phone number'
    type: string
    example: '+380123456789'
  email:
    description: 'Contact`s email'
    type: string
    example: 'example@mail.com'
  isFavourite:
    description: 'Whether the contact is marked as a favorite'
    type: boolean
    example: false
  contactType:
    description: 'Contact`s type'
    type: string
    enum: ['work', 'home', 'personal']
  photo:
    description: 'Link to contact`s photo'
    type: string
    example: 'https://res.cloudinary.com/dlvo73cul/image/upload/v1736761282/photos/xgr2hch9mqt3uwe8ycv7.jpg'
