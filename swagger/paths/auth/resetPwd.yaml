tags:
  - Auth
summary: Reset user password
operationId: resetPwd
description: 'Allows resetting the user password using the provided new password and jwt'
security: []
requestBody:
  content:
    application/json:
      schema:
        required:
          - password
          - token
        properties:
          password:
            type: string
            example: 'newPassword'
          token:
            type: string
            example: 'jwtToken'
responses:
  '200':
    description: 'Password has been successfully reset'
    content:
      application/json:
        schema:
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Password has been successfully reset'
            data: {}
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
