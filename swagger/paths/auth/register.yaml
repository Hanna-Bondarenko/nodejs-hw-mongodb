tags:
  - Auth
summary: User Registration
operationId: registerUser
description: 'Register a new user with the provided credentials'
security: []
requestBody:
  description: 'Data required to register a new user'
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            type: string
            description: 'Name of the user'
            example: 'Curt Anderson'
          email:
            type: string
            description: 'Unique email address for the user'
            format: email
            example: 'example@mail.com'
          password:
            type: string
            description: 'Password for the account (must be strong)'
            example: 'password123'
responses:
  '201':
    description: 'User successfully registered'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              description: 'HTTP status code'
              example: 201
            message:
              type: string
              description: 'Success message'
              example: 'Successfully registered a user!'
            data:
              $ref: ../../components/schemas/user.yaml
  '409':
    description: 'Conflict: Email is already in use'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              description: 'HTTP status code'
              example: 409
            message:
              type: string
              description: 'Error message for conflict'
              example: 'ConflictError'
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: 'Detailed error message'
                  example: 'Email in use'
  '500':
    $ref: '../../components/responses/500.yaml'
