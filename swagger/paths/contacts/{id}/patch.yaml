tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: 'Allows updating the details of an existing contact using the provided information'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '5f8f8c4f7f3b572d9c3f4b3b'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: 'Full name of the contact'
            type: string
            example: 'John Doe'
          phoneNumber:
            description: 'Contact phone number in international format'
            type: string
            example: '+38-096-777-0000'
          email:
            description: 'Contact email address'
            type: string
            example: 'contact@example.com'
          isFavourite:
            description: 'Indicates whether this contact is marked as a favorite'
            type: boolean
            example: true
          contactType:
            description: 'Defines the category of the contact'
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: 'URL or binary data of the contact photo'
            type: string
            format: binary
            example: 'https://example.com/photo.jpg'
responses:
  '200':
    description: 'Contact details successfully updated'
    content:
      application/json:
        schema:
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Contact has been successfully updated.'
            data:
              $ref: ../../../components/schemas/contacts.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
